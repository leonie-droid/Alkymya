[build]
  functions = "netlify/functions"
  publish = "dist"

[[redirects]]
  from = "/new-business.html"
  to = "/newbusiness/"
  status = 301
  force = true

[[redirects]]
  from = "/new-business"
  to = "/newbusiness/"
  status = 301
  force = true

[[redirects]]
  from = "/cohorte-fondatrice.html"
  to = "/newbusiness/"
  status = 301
  force = true

[[redirects]]
  from = "/cohorte-fondatrice"
  to = "/newbusiness/"
  status = 301
  force = true

[[redirects]]
  from = "/cohorte"
  to = "/newbusiness/"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
